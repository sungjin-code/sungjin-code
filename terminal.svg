<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; white-space: pre; }
    .ps    { fill: #9ece6a; font-weight: 700; }
    .cmd   { fill: #7aa2f7; }
    .out   { fill: #a9b1d6; }
    .title { fill: #787c99; font-size: 13px; }
    .ul    { stroke: #a9b1d6; stroke-opacity: 0.35; }
    .cursor { fill: #9ece6a; animation: blink 1.1s step-end infinite; }
    @keyframes blink { 50% { fill: transparent; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>

  <!-- window -->
  <rect x="0.5" y="0.5" width="519" height="379" rx="10" fill="#1a1b26" stroke="#2f334d"/>
  <path d="M10.5 0.5 H509.5 A10 10 0 0 1 519.5 10.5 V36 H0.5 V10.5 A10 10 0 0 1 10.5 0.5 Z" fill="#16161e"/>
  <line x1="0.5" y1="36" x2="519.5" y2="36" stroke="#2f334d"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="260" y="18" dominant-baseline="central" text-anchor="middle" class="title">sungjin-code@github: ~</text>

  <!-- grid: 24px line height, 40px between command blocks, 9px per char (0.6em @ 15px) -->
  <text x="28" y="72"><tspan class="ps">$ </tspan><tspan class="cmd">whoami --verbose</tspan></text>
  <text x="28" y="96" class="out"><tspan font-weight="700">Sungjin Park</tspan> · ML Engineer</text>
  <text x="28" y="120" class="out">Agentic Memory · RAG · Information Retrieval</text>

  <text x="28" y="160"><tspan class="ps">$ </tspan><tspan class="cmd">ls skills</tspan></text>
  <text x="28" y="184" class="out">Python  Go  JavaScript  SQL  Linux  Git</text>

  <!-- textLength pins link width so the underline always matches -->
  <text x="28" y="224"><tspan class="ps">$ </tspan><tspan class="cmd">which cv</tspan></text>
  <text x="28" y="248" class="out" textLength="180">~/sungjin-park-cv.pdf</text>
  <line x1="28" y1="252.5" x2="208" y2="252.5" class="ul"/>

  <text x="28" y="288"><tspan class="ps">$ </tspan><tspan class="cmd">cat contact</tspan></text>
  <text x="28" y="312" class="out">see links on my GitHub profile</text>

  <text x="28" y="352"><tspan class="ps">$ </tspan><tspan class="cursor">█</tspan></text>
</svg>